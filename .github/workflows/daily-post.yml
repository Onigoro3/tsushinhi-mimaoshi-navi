name: Daily Auto Post (Demon - 海外SIM・eSIM比較ガイド)

# 毎日 JST 11:05 に自動実行(UTC 2:05 = JST 11:05)。
# Dragon(型落ち家電ラボ, JST 9:05)・Angel(型落ちガジェット比較所, JST 10:05)と
# 実行時刻をずらし、部署対抗上の実行タイミングの混同・依存を避ける。
# 実行時刻はGitHub Actionsのベストエフォートのため数分〜のズレが生じ得る点に留意。
# 2026-07-15: GitHub公式ドキュメントが「毎時0分ちょうど(hour boundary)に集中する
# スケジュールは高負荷時に遅延・スキップされやすい」と明記しているため、分を0から
# 5へずらして負荷集中を避ける(SA全体点検でDragon/Angel当日分の実行が記録されて
# いなかったことを確認したことを受けた予防的対応)。
on:
  schedule:
    - cron: "5 2 * * *"
  workflow_dispatch: {}  # 手動実行・動作確認用

permissions:
  contents: read  # 2026-07-17: トピックの永続化先をSupabaseへ移行したため、
                  # git commit権限は不要になった(sa_common/supabase_store.py参照)

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto-post pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_DOMAIN: ${{ secrets.HATENA_BLOG_DOMAIN }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      # 実行失敗時のDiscord通知(2026-08-08、Fable監査・施策2で「コメントのまま放置」
      # だった拡張ポイントを実装)。SecretsのDISCORD_WEBHOOK_URLに通知先Webhook URLを
      # 登録すると有効になる。未設定の場合はこのステップは警告ログを出すだけで正常終了
      # する(=Secretを設定するだけで追加のコード変更なしに通知が始まる)。
      # 全4リポジトリ(Dragon/Angel/Demon/Venus)で同じSecret名を使うため、1つの
      # Discordチャンネルに全部署の失敗を集約できる。
      # ※このファイルの変更はワークフローの有効/無効状態には影響しない(Demonの
      #   Daily Auto Postは2026-08-03の社長判断で停止中=論点38の判断待ち。再有効化は
      #   このコミットでは行っていない)。
      - name: Notify failure to Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL Secretが未設定のため、Discord通知をスキップしました(Secretsに設定すれば有効になります)"
            exit 0
          fi
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"【Demon/海外SIM・eSIM比較ガイド】Daily Auto Post が失敗しました: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
